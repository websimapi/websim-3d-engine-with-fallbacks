<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Engine with Fallbacks</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.module.js",
            "three/addons/": "https://unpkg.com/three@r160/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js",
            "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.js"
        }
    }
    </script>
    <script src="https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-container">
            <h1>Loading Engine</h1>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <p id="loading-status">Initializing...</p>
        </div>
    </div>

    <div id="settings-panel" class="hidden">
        <h2>Engine Settings</h2>
        <div id="settings-container"></div>
    </div>

    <div id="error-screen" class="hidden">
        <div class="error-container">
            <h1>Error</h1>
            <p id="error-message"></p>
            <button id="try-fallback">Try Fallback</button>
        </div>
    </div>

    <div id="performance-stats"></div>
    <canvas id="renderCanvas"></canvas>

    <script src="config.js" type="module"></script>
    <script src="utils.js" type="module"></script>
    <script src="loaders.js" type="module"></script>
    <script src="engine.js" type="module"></script>
    <script src="scene.js" type="module"></script>
    <script src="main.js" type="module"></script>

</body>
</html>
